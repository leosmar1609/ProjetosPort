<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrato Digitalle</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#13244D">

<script>(function(){try{var t=localStorage.getItem('digitalle-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}})();</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Contrato Digitalle — mesmas cores e fontes do site (css/styles.css) */
:root{
  --bg:#F3F6FC; --surface:#FFFFFF; --surface-2:#E8EEFA;
  --text:#0F1B33; --text-muted:#56637E; --border:#D8E1F2;
  --brand:#13244D; --accent:#2F6FED; --accent-strong:#1C4FC4; --accent-contrast:#FFFFFF;
  --shadow-c:14,24,50;
  /* o papel é sempre claro, como sai na impressão */
  --paper:#FFFFFF; --ink:#0F1B33; --ink-muted:#56637E; --ink-line:#D8E1F2; --ink-soft:#F3F6FC;
  --ink-brand:#13244D; --ink-accent:#2F6FED;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070D20; --surface:#0F1835; --surface-2:#15204A;
    --text:#EAF1FF; --text-muted:#8C9BC4; --border:#223061;
    --brand:#8FC2FF; --accent:#3FA9FF; --accent-strong:#7CC9FF; --accent-contrast:#071022;
    --shadow-c:0,0,0;
  }
}
:root[data-theme="dark"]{
  --bg:#070D20; --surface:#0F1835; --surface-2:#15204A;
  --text:#EAF1FF; --text-muted:#8C9BC4; --border:#223061;
  --brand:#8FC2FF; --accent:#3FA9FF; --accent-strong:#7CC9FF; --accent-contrast:#071022;
  --shadow-c:0,0,0;
}

*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Archivo", ui-sans-serif, system-ui, sans-serif; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ---------- barra superior ---------- */
.topbar{
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:12px 20px; background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
}
.topbar .brand{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.14em; font-size:14px; color:var(--brand); text-decoration:none;}
.topbar .brand img{width:28px; height:28px;}
.topbar .brand small{font-family:"IBM Plex Mono", monospace; font-weight:400; letter-spacing:0; color:var(--text-muted); font-size:12px;}
.topbar .actions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;}
.btn{
  font:inherit; font-size:14px; font-weight:600; cursor:pointer;
  padding:9px 16px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); transition:transform .15s, background .15s;
}
.btn:hover{background:var(--surface-2);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
.btn.primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}

/* ---------- layout ---------- */
.layout{display:grid; grid-template-columns:minmax(300px, 400px) 1fr; gap:28px; padding:24px 20px 60px; max-width:1400px; margin:0 auto; align-items:start;}
@media (max-width: 960px){ .layout{grid-template-columns:1fr; padding:16px 16px 48px;} }

/* ---------- formulário ---------- */
.form{position:sticky; top:76px; max-height:calc(100vh - 96px); overflow:auto; padding-right:4px;}
@media (max-width: 960px){ .form{position:static; max-height:none;} }
.form details{background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden;}
.form summary{
  cursor:pointer; list-style:none; padding:13px 16px; font-weight:700; font-size:14px;
  display:flex; align-items:center; gap:10px;
}
.form summary::-webkit-details-marker{display:none;}
.form summary .n{font-family:"IBM Plex Mono", monospace; font-size:11px; color:var(--accent); font-weight:500;}
.form summary::after{content:"+"; margin-left:auto; color:var(--text-muted); font-weight:400; font-size:18px; line-height:1;}
.form details[open] summary::after{content:"–";}
.form .fields{padding:2px 16px 16px; display:grid; grid-template-columns:1fr 1fr; gap:10px 12px;}
.form label{display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:var(--text-muted); grid-column:span 2;}
.form label.half{grid-column:span 1;}
.form label.check{flex-direction:row; align-items:center; gap:8px; color:var(--text); font-weight:500; font-size:13px;}
.form input:not([type=checkbox]), .form select, .form textarea{
  font:inherit; font-size:14px; font-weight:400; color:var(--text);
  background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:8px 10px; width:100%;
}
.form textarea{resize:vertical; min-height:84px;}
.form input:focus, .form select:focus, .form textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent;}
.form input[type=checkbox]{accent-color:var(--accent); width:16px; height:16px;}
.form .hint{font-size:12px; color:var(--text-muted); margin:4px 2px 14px;}

/* ---------- papel (contrato) ---------- */
.stage{display:flex; justify-content:center; min-width:0;}
.paper{
  width:100%; max-width:210mm; background:var(--paper); color:var(--ink);
  padding:20mm 19mm 22mm; border-radius:6px;
  box-shadow:0 1px 2px rgba(var(--shadow-c),.08), 0 24px 60px -20px rgba(var(--shadow-c),.35);
  font-size:10.5pt; line-height:1.62; position:relative; overflow:hidden;
}
@media (max-width: 600px){ .paper{padding:28px 20px 32px; font-size:10pt;} }
.paper::before{ /* faixa de marca no topo */
  content:""; position:absolute; inset:0 0 auto 0; height:6px;
  background:linear-gradient(90deg, var(--ink-brand) 0 62%, var(--ink-accent) 62% 100%);
}

.doc-head{display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:16px; border-bottom:1px solid var(--ink-line);}
.doc-brand{display:flex; align-items:center; gap:10px;}
.doc-brand img{width:38px; height:38px;}
.doc-brand .word{font-weight:800; letter-spacing:.2em; font-size:15px; color:var(--ink-brand);}
.doc-brand .tag{display:block; font-size:9pt; letter-spacing:0; font-weight:400; color:var(--ink-muted);}
.doc-meta{text-align:right; font-family:"IBM Plex Mono", monospace; font-size:8.5pt; color:var(--ink-muted); line-height:1.5;}
.doc-meta b{color:var(--ink-brand); font-weight:500; font-size:9.5pt;}

.doc-title{margin:30px 0 6px;}
.doc-title .eyebrow{font-family:"IBM Plex Mono", monospace; font-size:8.5pt; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-accent);}
.doc-title h1{font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:25pt; line-height:1.12; margin:6px 0 8px; color:var(--ink-brand); letter-spacing:-.01em;}
.doc-title h1 em{font-style:italic; font-weight:480; color:var(--ink-accent);}
.doc-title p{margin:0; color:var(--ink-muted); font-size:10pt; max-width:58ch;}

.parties{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:24px 0 8px;}
@media (max-width: 600px){ .parties{grid-template-columns:1fr;} }
.party{background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:10px; padding:14px 16px; break-inside:avoid;}
.party .role{font-family:"IBM Plex Mono", monospace; font-size:8pt; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-accent);}
.party .name{font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:13pt; margin:3px 0 6px; color:var(--ink-brand); line-height:1.25;}
.party dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:1px 10px; font-size:9pt;}
.party dt{color:var(--ink-muted);}
.party dd{margin:0; overflow-wrap:anywhere;}

.preamble{margin:18px 0 6px; font-size:10pt; color:var(--ink);}

.clause{margin-top:22px;}
.clause h2{break-after:avoid; margin:0 0 6px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.clause h2 .num{font-family:"IBM Plex Mono", monospace; font-size:8pt; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-accent); font-weight:500;}
.clause h2 .t{font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:13pt; color:var(--ink-brand);}
.clause p{margin:0 0 6px; text-align:justify; hyphens:auto;}
.clause p .sn{font-family:"IBM Plex Mono", monospace; font-size:8.5pt; color:var(--ink-muted); margin-right:6px;}
.clause ul{margin:4px 0 8px; padding-left:0; list-style:none;}
.clause li{position:relative; padding-left:18px; margin:2px 0;}
.clause li::before{content:""; position:absolute; left:3px; top:.62em; width:6px; height:6px; border-radius:2px; background:var(--ink-accent);}

.money{
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; break-inside:avoid;
  margin:8px 0 10px; padding:12px 16px; border-left:3px solid var(--ink-accent); background:var(--ink-soft); border-radius:0 8px 8px 0;
}
.money .v{font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:17pt; color:var(--ink-brand);}
.money .x{font-size:9.5pt; color:var(--ink-muted); font-style:italic;}

table.plan{width:100%; border-collapse:collapse; margin:6px 0 10px; font-size:9.5pt; break-inside:avoid;}
table.plan th{text-align:left; font-family:"IBM Plex Mono", monospace; font-weight:500; font-size:8pt; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-muted); padding:6px 8px; border-bottom:1px solid var(--ink-line);}
table.plan td{padding:7px 8px; border-bottom:1px solid var(--ink-line);}
table.plan td:last-child, table.plan th:last-child{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
table.plan tr.total td{font-weight:700; color:var(--ink-brand); border-bottom:0;}

.blank{display:inline-block; min-width:110px; border-bottom:1px solid var(--ink-muted); height:1em; vertical-align:-2px;}
.blank.sm{min-width:50px;}

.closing{margin-top:28px; break-inside:avoid;}
.closing .place{text-align:right; margin:18px 0 0; font-style:italic; color:var(--ink);}
.signs{display:grid; grid-template-columns:1fr 1fr; gap:46px 36px; margin-top:58px; break-inside:avoid;}
@media (max-width: 600px){ .signs{grid-template-columns:1fr;} }
.sign{border-top:1px solid var(--ink); padding-top:7px; font-size:9pt; line-height:1.4;}
.sign b{display:block; font-size:9.5pt; color:var(--ink-brand);}
.sign span{color:var(--ink-muted);}
.witness-title{grid-column:1 / -1; margin:6px 0 -30px; font-family:"IBM Plex Mono", monospace; font-size:8pt; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-muted);}

.doc-foot{margin-top:40px; padding-top:12px; border-top:1px solid var(--ink-line); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-family:"IBM Plex Mono", monospace; font-size:7.5pt; color:var(--ink-muted);}

/* ---------- impressão / PDF ---------- */
@page{size:A4; margin:16mm 17mm 18mm;}
@media print{
  html, body{background:#fff !important;}
  .topbar, .form{display:none !important;}
  .layout{display:block; padding:0; max-width:none;}
  .paper{max-width:none; padding:0; box-shadow:none; border-radius:0; overflow:visible;}
  .paper::before{display:none;}
  .parties{grid-template-columns:1fr 1fr;}
  .signs{grid-template-columns:1fr 1fr;}
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <img src="assets/logo-digitalle-icone.png" alt="">
    <span>DIGITALLE <small>/ contrato</small></span>
  </a>
  <div class="actions">
    <button class="btn" type="button" id="btnExemplo">Preencher exemplo</button>
    <button class="btn" type="button" id="btnLimpar">Limpar cliente</button>
    <button class="btn primary" type="button" id="btnImprimir">Imprimir / Salvar PDF</button>
  </div>
</header>

<main class="layout">
  <form class="form" id="form" autocomplete="off" onsubmit="return false;"></form>
  <div class="stage"><article class="paper" id="paper" aria-label="Pré-visualização do contrato"></article></div>
</main>

<script src="contrato.js"></script>
</body>
</html>
