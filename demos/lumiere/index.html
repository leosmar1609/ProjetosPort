<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: o app ocupa a tela toda do iPhone (inclusive atrás da barra de status) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lumière</title>

    <!-- Instalado pela "Tela de Início" do iPhone: abre em tela cheia, sem a barra do Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lumière" />
    <meta name="theme-color" content="#2A1E19" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #fbf6f1;
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- ===================== Abertura animada da Lumière ===================== -->
    <style>
      #intro {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 42%, #fdefe4 0%, #fbf6f1 55%, #f5ebe1 100%);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      #intro.saindo {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      #intro .marca {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      #intro .ponto {
        width: 14px;
        height: 14px;
        margin-top: 10px;
        border-radius: 50%;
        background: #d2603a;
        transform: scale(0);
        animation: ponto 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards, aura 1.4s ease-out 0.85s;
      }
      #intro .palavra {
        position: relative;
        padding: 0 4px;
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 600;
        font-size: 58px;
        line-height: 1.15;
        letter-spacing: 0.5px;
        color: #1e1714;
        overflow: hidden;
      }
      #intro .letra {
        display: inline-block;
        opacity: 0;
        transform: translateY(20px);
        filter: blur(6px);
        animation: letra 0.75s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      #intro .letra:nth-child(1) { animation-delay: 0.45s; }
      #intro .letra:nth-child(2) { animation-delay: 0.51s; }
      #intro .letra:nth-child(3) { animation-delay: 0.57s; }
      #intro .letra:nth-child(4) { animation-delay: 0.63s; }
      #intro .letra:nth-child(5) { animation-delay: 0.69s; }
      #intro .letra:nth-child(6) { animation-delay: 0.75s; }
      #intro .letra:nth-child(7) { animation-delay: 0.81s; }
      /* o "brilho" que passa pelo nome */
      #intro .palavra::after {
        content: '';
        position: absolute;
        top: -10%;
        bottom: -10%;
        left: -50%;
        width: 35%;
        background: linear-gradient(100deg, transparent 0%, rgba(255, 236, 222, 0.95) 50%, transparent 100%);
        transform: skewX(-18deg);
        opacity: 0;
        animation: brilho 0.95s ease-in-out 1.35s forwards;
      }
      #intro .linha {
        width: 0;
        height: 1px;
        margin-top: 18px;
        background: linear-gradient(90deg, transparent, #d2603a, transparent);
        animation: linha 0.8s ease 1.45s forwards;
      }
      #intro .slogan {
        margin-top: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #8a7a70;
        opacity: 0;
        transform: translateY(6px);
        animation: surgir 0.7s ease 1.6s forwards;
      }
      @keyframes ponto { to { transform: scale(1); } }
      @keyframes aura {
        0% { box-shadow: 0 0 0 0 rgba(210, 96, 58, 0.45); }
        100% { box-shadow: 0 0 0 18px rgba(210, 96, 58, 0); }
      }
      @keyframes letra { to { opacity: 1; transform: none; filter: blur(0); } }
      @keyframes brilho {
        0% { left: -50%; opacity: 1; }
        100% { left: 120%; opacity: 1; }
      }
      @keyframes linha { to { width: 140px; } }
      @keyframes surgir { to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #intro *, #intro *::after { animation-duration: 0.01s !important; animation-delay: 0s !important; }
      }
    </style>
  <meta name="theme-color" content="#FBF6F1">
<link rel="icon" href="/demos/lumiere/favicon.ico"/></head>

  <body>
    <noscript>Ative o JavaScript para usar o app da Lumière.</noscript>

    <div id="intro" aria-hidden="true">
      <div class="marca">
        <span class="ponto"></span>
        <span class="palavra"><span class="letra">L</span><span class="letra">u</span><span class="letra">m</span><span class="letra">i</span><span class="letra">è</span><span class="letra">r</span><span class="letra">e</span></span>
      </div>
      <div class="linha"></div>
      <div class="slogan">Brownies artesanais</div>
    </div>

    <div id="root"></div>

    <script>
      // A abertura toca por pelo menos 2,4s e some quando o app avisa que está pronto (window.fimIntro)
      (function () {
        var inicio = Date.now();
        var MINIMO = 2400;
        var encerrada = false;
        window.fimIntro = function () {
          if (encerrada) return;
          encerrada = true;
          var intro = document.getElementById('intro');
          if (!intro) return;
          setTimeout(function () {
            intro.classList.add('saindo');
            setTimeout(function () { intro.remove(); }, 650);
          }, Math.max(0, MINIMO - (Date.now() - inicio)));
        };
        // Garantia: se algo der errado no app, a abertura não fica presa na tela
        setTimeout(window.fimIntro, 10000);
      })();
    </script>
  <script src="/demos/lumiere/_expo/static/js/web/index-efa056e9d5dc9d97fea8f4382d907855.js" defer></script>
</body>
</html>
