<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: o app ocupa a tela toda do celular (inclusive atrás da barra de status) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Monitor do Sorriso</title>
    <meta name="description" content="Acompanhamento da saúde bucal dos adolescentes: kits de higiene nos totens das escolas, consultas na UBS e orientações." />

    <!-- Instalado pela "Tela de Início" (iPhone) ou "Instalar app" (Android): abre em tela cheia -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sorriso" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #fbf7f9;
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- ===================== Abertura animada ===================== -->
    <style>
      #intro {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: radial-gradient(circle at 50% 38%, #ffffff 0%, #fdf0f5 45%, #f6dce7 100%);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      #intro.saindo {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      #intro .logo {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        opacity: 0;
        transform: scale(0.6) rotate(-8deg);
        animation: logo 0.9s cubic-bezier(0.2, 1.4, 0.4, 1) 0.15s forwards, brilho 1.6s ease-out 0.95s;
      }
      #intro .nome {
        margin-top: 22px;
        font-family: 'Nunito', system-ui, sans-serif;
        font-weight: 800;
        font-size: 32px;
        line-height: 1.15;
        color: #7b3f61;
        opacity: 0;
        transform: translateY(10px);
        animation: surgir 0.7s ease 0.7s forwards;
      }
      #intro .lema {
        margin-top: 12px;
        font-family: 'Nunito', system-ui, sans-serif;
        font-weight: 600;
        font-size: 15px;
        color: #8a7884;
        opacity: 0;
        animation: surgir 0.7s ease 1.1s forwards;
      }
      #intro .pontos {
        display: flex;
        gap: 8px;
        margin-top: 26px;
        opacity: 0;
        animation: surgir 0.4s ease 1.4s forwards;
      }
      #intro .pontos span {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ec7fa3;
        animation: pulo 1s ease-in-out infinite;
      }
      #intro .pontos span:nth-child(2) { animation-delay: 0.15s; background: #b9a6d9; }
      #intro .pontos span:nth-child(3) { animation-delay: 0.3s; background: #6fa3ac; }
      @keyframes logo { to { opacity: 1; transform: none; } }
      @keyframes brilho {
        0% { box-shadow: 0 0 0 0 rgba(236, 127, 163, 0.45); }
        100% { box-shadow: 0 0 0 30px rgba(236, 127, 163, 0); }
      }
      @keyframes surgir { to { opacity: 1; transform: none; } }
      @keyframes pulo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @media (prefers-reduced-motion: reduce) {
        #intro * { animation-duration: 0.01s !important; animation-delay: 0s !important; }
      }
    </style>
  <meta name="theme-color" content="#7B3F61">
<link rel="icon" href="/demos/monitor-sorriso/favicon.ico"/></head>

  <body>
    <noscript>Ative o JavaScript para usar o Monitor do Sorriso.</noscript>

    <div id="intro" aria-hidden="true">
      <img class="logo" src="logo.svg" alt="" />
      <div class="nome">Monitor do<br />Sorriso</div>
      <div class="lema">Sorriso Acessível · saúde bucal na escola</div>
      <div class="pontos"><span></span><span></span><span></span></div>
    </div>

    <div id="root"></div>

    <script>
      // A abertura toca por pelo menos 2s e some quando o app avisa que está pronto (window.fimIntro)
      (function () {
        var inicio = Date.now();
        var MINIMO = 2000;
        var encerrada = false;
        window.fimIntro = function () {
          if (encerrada) return;
          encerrada = true;
          var intro = document.getElementById('intro');
          if (!intro) return;
          setTimeout(function () {
            intro.classList.add('saindo');
            setTimeout(function () { intro.remove(); }, 650);
          }, Math.max(0, MINIMO - (Date.now() - inicio)));
        };
        setTimeout(window.fimIntro, 10000);
      })();
    </script>
  <script src="/demos/monitor-sorriso/_expo/static/js/web/index-5d77b21e96a53dff4e25ebc79593b8d0.js" defer></script>
</body>
</html>
