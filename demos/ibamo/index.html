<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: o app ocupa a tela toda do celular (inclusive atrás da barra de status) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>IBAMO</title>

    <!-- Instalado pela "Tela de Início" (iPhone) ou "Instalar app" (Android): abre em tela cheia -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IBAMO" />
    <meta name="theme-color" content="#1F2D4A" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&display=swap" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #f6f4ef;
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- ===================== Abertura animada da IBAMO ===================== -->
    <style>
      #intro {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: radial-gradient(circle at 50% 40%, #24345a 0%, #1f2d4a 50%, #121b2e 100%);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      #intro.saindo {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      #intro .logo {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        opacity: 0;
        transform: scale(0.82);
        animation: logo 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s forwards, luz 1.6s ease-out 0.9s;
      }
      #intro .nome {
        margin-top: 22px;
        font-family: 'Lora', Georgia, serif;
        font-weight: 600;
        font-size: 22px;
        line-height: 1.3;
        color: #f6f4ef;
        opacity: 0;
        transform: translateY(10px);
        animation: surgir 0.8s ease 0.75s forwards;
      }
      #intro .linha {
        width: 0;
        height: 1px;
        margin-top: 16px;
        background: linear-gradient(90deg, transparent, #b08d3c, transparent);
        animation: linha 0.8s ease 1.1s forwards;
      }
      #intro .versiculo {
        margin-top: 14px;
        max-width: 300px;
        font-family: 'Lora', Georgia, serif;
        font-style: italic;
        font-size: 14px;
        color: #c9d3e6;
        opacity: 0;
        animation: surgir 0.8s ease 1.35s forwards;
      }
      @keyframes logo { to { opacity: 1; transform: scale(1); } }
      @keyframes luz {
        0% { box-shadow: 0 0 0 0 rgba(176, 141, 60, 0.5); }
        100% { box-shadow: 0 0 0 26px rgba(176, 141, 60, 0); }
      }
      @keyframes surgir { to { opacity: 1; transform: none; } }
      @keyframes linha { to { width: 160px; } }
      @media (prefers-reduced-motion: reduce) {
        #intro * { animation-duration: 0.01s !important; animation-delay: 0s !important; }
      }
    </style>
  <meta name="theme-color" content="#1F2D4A">
<link rel="icon" href="/demos/ibamo/favicon.ico"/></head>

  <body>
    <noscript>Ative o JavaScript para usar o app da IBAMO.</noscript>

    <div id="intro" aria-hidden="true">
      <img class="logo" src="logo.svg" alt="" />
      <div class="nome">Igreja Batista<br />Monte das Oliveiras</div>
      <div class="linha"></div>
      <div class="versiculo">“Servi uns aos outros, cada um conforme o dom que recebeu.” — 1 Pedro 4:10</div>
    </div>

    <div id="root"></div>

    <script>
      // A abertura toca por pelo menos 2,2s e some quando o app avisa que está pronto (window.fimIntro)
      (function () {
        var inicio = Date.now();
        var MINIMO = 2200;
        var encerrada = false;
        window.fimIntro = function () {
          if (encerrada) return;
          encerrada = true;
          var intro = document.getElementById('intro');
          if (!intro) return;
          setTimeout(function () {
            intro.classList.add('saindo');
            setTimeout(function () { intro.remove(); }, 650);
          }, Math.max(0, MINIMO - (Date.now() - inicio)));
        };
        setTimeout(window.fimIntro, 10000);
      })();
    </script>
  <script src="/demos/ibamo/_expo/static/js/web/index-8ec2c4e33982cc955e9581c9b87b82c8.js" defer></script>
</body>
</html>
