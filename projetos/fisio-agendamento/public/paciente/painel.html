<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas sessões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:opsz,wght@8..30,500;8..30,600;8..30,700&family=Nunito+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<style>
  .resumo{display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1.6rem;}
  .resumo .cartao{flex:1; min-width:180px; text-align:center;}
  .resumo .valor{font-family:"Petrona",serif; font-size:1.9rem; color:var(--brand);}
  .resumo .rotulo{font-size:.76rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted);}
  .linha-sessao{display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;}
  .linha-sessao .acoes{display:flex; gap:.5rem;}
</style>
</head>
<body>
<header class="topo">
  <div class="wrap">
    <a class="marca" href="/">Anna Barbosa</a>
    <nav>
      <span id="saudacao"></span>
      <a href="../perfil.html">Perfil</a>
      <a href="#" id="link-sair">Sair</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1>Minhas sessões</h1>

  <div class="resumo">
    <div class="cartao">
      <div class="valor" id="valor-restantes">—</div>
      <div class="rotulo">Sessões disponíveis</div>
    </div>
    <div class="cartao">
      <div class="valor" id="valor-agendadas">—</div>
      <div class="rotulo">Próximas agendadas</div>
    </div>
  </div>

  <div id="aviso" class="aviso" hidden></div>

  <p><a class="btn btn-primario" href="agendar.html" id="btn-agendar">Agendar nova sessão</a></p>

  <div class="cartao">
    <table>
      <thead>
        <tr><th>Sessão</th><th>Data</th><th>Hora</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="tabela-sessoes"></tbody>
    </table>
    <p id="texto-vazio" class="rodape-nota" hidden>Você ainda não tem sessões agendadas.</p>
  </div>
</main>

<script src="../js/api.js"></script>
<script>
  const sessao = exigirSessao('paciente');
  if (sessao) {
    document.getElementById('saudacao').textContent = `Olá, ${sessao.usuario.nome}`;
  }
  document.getElementById('link-sair').addEventListener('click', (ev) => { ev.preventDefault(); sair(); });

  const aviso = document.getElementById('aviso');
  const corpoTabela = document.getElementById('tabela-sessoes');

  const PILL_STATUS = { agendada: 'Agendada', concluida: 'Concluída', cancelada: 'Cancelada' };

  async function carregar() {
    try {
      const { sessoes, saldo } = await api('/sessoes/minhas');

      document.getElementById('valor-restantes').textContent = saldo.ilimitado ? '∞' : saldo.restantes;
      document.getElementById('valor-agendadas').textContent = sessoes.filter((s) => s.status === 'agendada').length;

      const btnAgendar = document.getElementById('btn-agendar');
      if (!saldo.ilimitado && saldo.restantes <= 0) {
        btnAgendar.setAttribute('aria-disabled', 'true');
        btnAgendar.style.pointerEvents = 'none';
        btnAgendar.style.opacity = '.5';
        btnAgendar.textContent = 'Sem sessões disponíveis';
      }

      corpoTabela.innerHTML = '';
      document.getElementById('texto-vazio').hidden = sessoes.length > 0;

      sessoes.forEach((s) => {
        const tr = document.createElement('tr');
        const podeMexer = s.status === 'agendada';
        tr.innerHTML = `
          <td>#${s.numero_sessao}</td>
          <td>${formatarData(s.data)}</td>
          <td>${s.hora}</td>
          <td><span class="pill pill-${s.status}">${PILL_STATUS[s.status]}</span></td>
          <td>
            ${podeMexer ? `<div class="linha-sessao acoes">
              <button class="btn btn-secundario" data-cancelar="${s.id}">Cancelar</button>
            </div>` : ''}
          </td>
        `;
        corpoTabela.appendChild(tr);
      });

      corpoTabela.querySelectorAll('[data-cancelar]').forEach((btn) => {
        btn.addEventListener('click', () => cancelar(btn.dataset.cancelar));
      });
    } catch (erro) {
      mostrarAviso(aviso, erro.message);
    }
  }

  async function cancelar(id) {
    if (!confirm('Cancelar essa sessão?')) return;
    try {
      await api(`/sessoes/${id}/cancelar`, { method: 'PATCH' });
      carregar();
    } catch (erro) {
      mostrarAviso(aviso, erro.message);
    }
  }

  carregar();
</script>
</body>
</html>
