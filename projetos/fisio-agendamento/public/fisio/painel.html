<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda — painel da fisio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:opsz,wght@8..30,500;8..30,600;8..30,700&family=Nunito+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<header class="topo">
  <div class="wrap">
    <a class="marca" href="painel.html">Painel da fisio</a>
    <nav>
      <a href="gerar-codigo.html">Gerar código</a>
      <a href="horarios.html">Horários</a>
      <a href="../perfil.html">Perfil</a>
      <a href="#" id="link-sair">Sair</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1>Agenda</h1>
  <div id="aviso" class="aviso" hidden></div>

  <div class="cartao">
    <table>
      <thead>
        <tr><th>Data</th><th>Hora</th><th colspan="2">Paciente</th><th>Sessão</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
    <p id="texto-vazio" class="rodape-nota" hidden>Nenhuma sessão agendada ainda.</p>
  </div>
</main>

<script src="../js/api.js"></script>
<script>
  exigirSessao('fisio');
  document.getElementById('link-sair').addEventListener('click', (ev) => { ev.preventDefault(); sair(); });

  const aviso = document.getElementById('aviso');
  const tabela = document.getElementById('tabela');
  const PILL_STATUS = { agendada: 'Agendada', concluida: 'Concluída', cancelada: 'Cancelada' };

  async function carregar() {
    try {
      const { sessoes } = await api('/sessoes');
      document.getElementById('texto-vazio').hidden = sessoes.length > 0;

      tabela.innerHTML = '';
      sessoes.forEach((s) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${formatarData(s.data)}</td>
          <td>${s.hora}</td>
          <td style="width:1%;padding-right:0;">${avatarHtml(s.paciente_nome, s.paciente_foto, 'avatar-mini')}</td>
          <td>${escapeHtml(s.paciente_nome)}${s.paciente_telefone ? `<br><span class="rodape-nota" style="margin:0;">${escapeHtml(s.paciente_telefone)}</span>` : ''}</td>
          <td>#${s.numero_sessao}</td>
          <td><span class="pill pill-${s.status}">${PILL_STATUS[s.status]}</span></td>
          <td>${s.status === 'agendada' ? `<button class="btn btn-secundario" data-concluir="${s.id}">Marcar concluída</button>` : ''}</td>
        `;
        tabela.appendChild(tr);
      });

      tabela.querySelectorAll('[data-concluir]').forEach((btn) => {
        btn.addEventListener('click', () => concluir(btn.dataset.concluir));
      });
    } catch (erro) {
      mostrarAviso(aviso, erro.message);
    }
  }

  async function concluir(id) {
    try {
      await api(`/sessoes/${id}/concluir`, { method: 'PATCH' });
      carregar();
    } catch (erro) {
      mostrarAviso(aviso, erro.message);
    }
  }

  carregar();
</script>
</body>
</html>
