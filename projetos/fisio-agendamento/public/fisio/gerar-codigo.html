<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerar código de acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:opsz,wght@8..30,500;8..30,600;8..30,700&family=Nunito+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<header class="topo">
  <div class="wrap">
    <a class="marca" href="painel.html">Painel da fisio</a>
    <nav>
      <a href="painel.html">← Agenda</a>
      <a href="horarios.html">Horários</a>
      <a href="../perfil.html">Perfil</a>
      <a href="#" id="link-sair">Sair</a>
    </nav>
  </div>
</header>

<main class="wrap-estreito">
  <h1>Gerar código de acesso</h1>
  <p class="rodape-nota" style="margin-top:-.4rem;">
    Depois de conversar com a paciente, gere um código aqui e combine com o tipo de liberação certo pra ela.
  </p>

  <div id="aviso" class="aviso" hidden></div>
  <div id="resultado" class="cartao" hidden style="margin-bottom:1.4rem;">
    <p class="rodape-nota" style="margin:0 0 .5rem;">Código gerado — copie e envie pra paciente:</p>
    <div class="codigo-gerado" id="codigo-texto"></div>
  </div>

  <div class="cartao">
    <form id="form-codigo">
      <div class="campo">
        <label for="tipo">O que esse código libera?</label>
        <select id="tipo" name="tipo" required>
          <option value="sessao_unica">Uma sessão avulsa</option>
          <option value="pacote">Um pacote de sessões</option>
          <option value="continuo">Acesso contínuo (até eu desativar)</option>
        </select>
      </div>
      <div class="campo" id="campo-quantidade" hidden>
        <label for="quantidade_sessoes">Quantas sessões?</label>
        <input id="quantidade_sessoes" name="quantidade_sessoes" type="number" min="1">
      </div>
      <div class="campo">
        <label for="validade">Válido até (opcional)</label>
        <input id="validade" name="validade" type="date">
      </div>
      <div class="campo">
        <label for="observacao">Anotação pra você (opcional — nome da paciente, combinado, etc.)</label>
        <textarea id="observacao" name="observacao"></textarea>
      </div>
      <button class="btn btn-primario" type="submit" style="width:100%;">Gerar código</button>
    </form>
  </div>

  <div class="cartao" style="margin-top:1.4rem;">
    <h2 style="font-size:1.05rem;">Códigos gerados recentemente</h2>
    <table>
      <thead><tr><th>Código</th><th>Tipo</th><th>Status</th><th>Obs.</th></tr></thead>
      <tbody id="tabela-codigos"></tbody>
    </table>
  </div>
</main>

<script src="../js/api.js"></script>
<script>
  exigirSessao('fisio');
  document.getElementById('link-sair').addEventListener('click', (ev) => { ev.preventDefault(); sair(); });

  const aviso = document.getElementById('aviso');
  const resultado = document.getElementById('resultado');
  const form = document.getElementById('form-codigo');
  const campoQuantidade = document.getElementById('campo-quantidade');

  document.getElementById('tipo').addEventListener('change', (ev) => {
    campoQuantidade.hidden = ev.target.value !== 'pacote';
  });

  const ROTULO_TIPO = {
    sessao_unica: 'Sessão avulsa',
    pacote: 'Pacote',
    continuo: 'Contínuo',
  };

  async function carregarCodigos() {
    try {
      const { codigos } = await api('/codigos');
      const corpo = document.getElementById('tabela-codigos');
      corpo.innerHTML = '';
      codigos.forEach((c) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-family:'IBM Plex Mono',monospace;">${c.codigo}</td>
          <td>${ROTULO_TIPO[c.tipo]}${c.tipo === 'pacote' ? ` (${c.quantidade_sessoes})` : ''}</td>
          <td>${c.usado_por ? '<span class="pill pill-concluida">Usado</span>' : '<span class="pill pill-livre">Disponível</span>'}</td>
          <td>${escapeHtml(c.observacao || '')}</td>
        `;
        corpo.appendChild(tr);
      });
    } catch (erro) {
      mostrarAviso(aviso, erro.message);
    }
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    aviso.hidden = true;
    const dados = Object.fromEntries(new FormData(form).entries());
    if (dados.quantidade_sessoes) dados.quantidade_sessoes = Number(dados.quantidade_sessoes);
    if (!dados.validade) delete dados.validade;

    try {
      const { codigo } = await api('/codigos', { method: 'POST', body: dados });
      document.getElementById('codigo-texto').textContent = codigo.codigo;
      resultado.hidden = false;
      form.reset();
      campoQuantidade.hidden = true;
      carregarCodigos();
    } catch (erro) {
      mostrarAviso(aviso, erro.message);
    }
  });

  carregarCodigos();
</script>
</body>
</html>
