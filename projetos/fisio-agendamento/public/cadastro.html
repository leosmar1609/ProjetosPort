<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:opsz,wght@8..30,500;8..30,600;8..30,700&family=Nunito+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topo">
  <div class="wrap">
    <a class="marca" href="/">Move Fisioterapia</a>
    <nav><a href="/login.html">Já tenho conta</a></nav>
  </div>
</header>

<main>
  <div class="wrap-estreito">
    <div class="cartao">
      <h2>Criar sua conta</h2>
      <p class="rodape-nota" style="margin-top:-.4rem;margin-bottom:1.2rem;">
        Use o código que a fisioterapeuta te passou depois da nossa conversa.
      </p>
      <div id="aviso" class="aviso" hidden></div>
      <form id="form-cadastro">
        <div class="campo">
          <label for="codigo">Código de acesso</label>
          <input id="codigo" name="codigo" type="text" placeholder="FT-XXXX-XXXX" required style="text-transform:uppercase;">
        </div>
        <div class="campo">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" required>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" required>
        </div>
        <div class="campo">
          <label for="telefone">WhatsApp ou telefone</label>
          <input id="telefone" name="telefone" type="text">
        </div>
        <div class="campo">
          <label for="senha">Crie uma senha</label>
          <input id="senha" name="senha" type="password" minlength="6" required>
        </div>
        <div class="campo">
          <label for="problema_relatado">Sobre o que você está sentindo (opcional)</label>
          <textarea id="problema_relatado" name="problema_relatado"></textarea>
        </div>
        <button class="btn btn-primario" type="submit" style="width:100%;">Criar conta</button>
      </form>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script>
  redirecionarSeLogado();

  const form = document.getElementById('form-cadastro');
  const aviso = document.getElementById('aviso');

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    aviso.hidden = true;
    const dados = Object.fromEntries(new FormData(form).entries());
    dados.codigo = dados.codigo.trim().toUpperCase();

    try {
      const resposta = await api('/auth/cadastro', { method: 'POST', body: dados, autenticado: false });
      salvarSessao(resposta.token, resposta.usuario);
      window.location.href = '/paciente/painel.html';
    } catch (erro) {
      mostrarAviso(aviso, erro.message);
    }
  });
</script>
</body>
</html>
