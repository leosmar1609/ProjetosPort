# perfil "h2": roda sem MySQL, com o banco num arquivo na pasta ./dados. bom pra testar rápido
# uso: mvnw -pl servidor spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:file:./dados/lojaodamari;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
