# perfil "local": o servidor roda dentro do app desktop (tudo num programa só)
# o banco H2 fica na pasta de dados do usuário (${lojao.pasta}), então atualizar o app não apaga nada
# pra usar MySQL nesse modo, coloque as linhas spring.datasource.* no arquivo servidor.properties dessa mesma pasta
spring.datasource.url=jdbc:h2:file:${lojao.pasta}/dados/lojaodamari;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.main.banner-mode=off
logging.file.name=${lojao.pasta}/lojaodamari.log
# cada parte do servidor só é montada quando for usada pela primeira vez: o app abre bem mais rápido
spring.main.lazy-initialization=true
