# configuração do servidor. tudo que muda de uma máquina pra outra vem de variável de ambiente, com um padrão pra rodar local

spring.application.name=lojaodamari
server.port=${LOJAO_PORTA:8080}

# banco MySQL (o mesmo do MySQL Workbench). o banco lojaodamari é criado sozinho se não existir
spring.datasource.url=${LOJAO_DB_URL:jdbc:mysql://localhost:3306/lojaodamari?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${LOJAO_DB_USUARIO:root}
spring.datasource.password=${LOJAO_DB_SENHA:}

# quem cria e altera as tabelas é o Flyway (db/migration). o Hibernate só usa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# segredo que assina o token de login. em produção troque por um texto grande e aleatório
lojao.jwt.segredo=${LOJAO_JWT_SEGREDO:troque-este-segredo-em-producao-lojaodamari-2026}
lojao.jwt.horas=12

# cria usuários, produtos e 35 dias de vendas de exemplo na primeira vez que o banco sobe vazio
lojao.demo.ativo=${LOJAO_DEMO:true}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
